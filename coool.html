<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex min-h-screen antialiased">

  <aside class="w-20 bg-white border-r border-gray-100 flex flex-col items-center justify-between py-6 shrink-0 h-screen sticky top-0">
    <div class="flex items-center justify-center">
      <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center shadow-sm shadow-amber-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="white" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
      </div>
    </div>

    <nav class="flex flex-col gap-6 w-full px-3">
      <a href="#" class="bg-gray-900 text-white p-3.5 rounded-xl flex items-center justify-center shadow-lg shadow-gray-900/10 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
      </a>
      
      <a href="#" class="text-gray-400 hover:text-gray-900 p-3.5 rounded-xl flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.604 10.604Z" />
        </svg>
      </a>

      <a href="#" class="text-gray-400 hover:text-gray-900 p-3.5 rounded-xl flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-2.533-4.656c-.9-.374-1.856-.633-2.848-.774M15 19.128v-.75a9.06 9.06 0 0 0-1.5-4.823M15 19.128a9.349 9.349 0 0 1-6 0M15 19.128v-.75a8.908 8.908 0 0 0-1.422-4.717M9.75 19.128a9.38 9.38 0 0 1-2.625.372 9.337 9.337 0 0 1-4.121-.952 4.125 4.125 0 0 1 2.533-4.656c.9-.374 1.856-.633 2.848-.774M9.75 19.128v-.75a9.06 9.06 0 0 1 1.5-4.823M9.3 16.515a8.908 8.908 0 0 1 1.422-4.717M10.5 11.25a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM16.5 7.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </a>

      <a href="#" class="text-gray-400 hover:text-gray-900 p-3.5 rounded-xl flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" />
        </svg>
      </a>
    </nav>

    <div class="mt-auto">
      <a href="#" class="text-gray-400 hover:text-gray-900 p-2 rounded-xl flex items-center justify-center transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
      </a>
    </div>
  </aside>

  <main class="flex-1 bg-white m-4 rounded-3xl border border-gray-100 shadow-sm p-8 flex flex-col gap-10 overflow-y-auto h-[calc(100vh-2rem)]">
    
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h1 class="text-3xl font-semibold tracking-tight">Hi</h1>
        <span class="text-3xl">👋</span>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="relative w-72">
          <input 
            type="text" 
            placeholder="Search properties" 
            class="w-full bg-gray-50/70 border border-gray-200/60 rounded-xl pl-4 pr-10 py-2.5 text-sm placeholder-gray-400 focus:outline-none focus:border-gray-300 focus:bg-white transition-all"
          >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-gray-400 absolute right-3.5 top-1/2 -translate-y-1/2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.604 10.604Z" />
          </svg>
        </div>
        
        <button class="flex items-center gap-2 border border-gray-200/60 rounded-xl px-4 py-2.5 text-sm font-medium text-gray-600 bg-white hover:bg-gray-50 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-gray-500">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
          Filters
        </button>
      </div>
    </header>

    <section class="flex flex-col gap-6">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Featured Properties</h2>
      
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        
        <div class="relative group rounded-[2.5rem] overflow-hidden aspect-[1.4/1] bg-gradient-to-br from-rose-400 to-red-800 shadow-sm flex flex-col justify-between p-6 text-white">
          <div class="absolute inset-0 bg-black/15 group-hover:bg-black/20 transition-all pointer-events-none"></div>
          
          <div class="absolute inset-x-0 bottom-0 top-1/3 bg-gradient-to-t from-black/80 via-black/40 to-transparent pointer-events-none"></div>

          <div class="relative z-10 flex items-start justify-between w-full">
            <div class="bg-white/90 backdrop-blur-md text-gray-800 rounded-full py-2 px-4 flex items-center gap-1.5 text-xs font-semibold shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 text-gray-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
              </svg>
              Pleasantville
            </div>

            <div class="bg-white/20 backdrop-blur-md border border-white/20 p-1 rounded-xl flex items-center gap-1">
              <div class="w-7 h-7 rounded-lg bg-red-100/30 border border-white/20 overflow-hidden shrink-0"></div>
              <div class="w-7 h-7 rounded-lg bg-amber-100/30 border border-white/20 overflow-hidden shrink-0"></div>
              <div class="w-7 h-7 rounded-lg bg-neutral-900/40 text-[10px] font-bold flex items-center justify-center border border-white/10 shrink-0">+2</div>
            </div>
          </div>

          <div class="relative z-10 flex flex-col gap-1.5 max-w-md">
            <h3 class="text-2xl font-bold tracking-tight">Suburb Home</h3>
            <p class="text-sm text-gray-200/90 leading-relaxed font-normal line-clamp-2">
              Located in a charming suburban neighborhood, this beautiful home gracefully...
            </p>
          </div>
        </div>

        <div class="relative group rounded-[2.5rem] overflow-hidden aspect-[1.4/1] bg-gradient-to-br from-sky-400 via-blue-600 to-indigo-950 shadow-sm flex flex-col justify-between p-6 text-white">
          <div class="absolute inset-0 bg-black/10 group-hover:bg-black/15 transition-all pointer-events-none"></div>
          <div class="absolute inset-x-0 bottom-0 top-1/3 bg-gradient-to-t from-black/80 via-black/40 to-transparent pointer-events-none"></div>

          <div class="relative z-10 flex items-start justify-between w-full">
            <div class="bg-white/90 backdrop-blur-md text-gray-800 rounded-full py-2 px-4 flex items-center gap-1.5 text-xs font-semibold shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 text-gray-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
              </svg>
              Catskills
            </div>

            <div class="bg-white/20 backdrop-blur-md border border-white/20 p-1 rounded-xl flex items-center gap-1">
              <div class="w-7 h-7 rounded-lg bg-sky-100/30 border border-white/20 overflow-hidden shrink-0"></div>
              <div class="w-7 h-7 rounded-lg bg-indigo-100/30 border border-white/20 overflow-hidden shrink-0"></div>
              <div class="w-7 h-7 rounded-lg bg-neutral-900/40 text-[10px] font-bold flex items-center justify-center border border-white/10 shrink-0">+2</div>
            </div>
          </div>

          <div class="relative z-10 flex flex-col gap-1.5 max-w-md">
            <h3 class="text-2xl font-bold tracking-tight">Smart Home Duplex</h3>
            <p class="text-sm text-gray-200/90 leading-relaxed font-normal line-clamp-2">
              Situated in a bustling urban neighborhood, this smart home duplex elegantly...
            </p>
          </div>
        </div>

      </div>
    </section>

    <div class="fixed bottom-8 right-8 z-50">
      <div class="bg-white border border-gray-200 shadow-xl rounded-xl px-3 py-2 flex items-center gap-1.5 text-xs font-bold text-gray-900 tracking-wide cursor-default selection:bg-transparent">
        <svg class="w-3.5 h-3.5 text-black" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 3h20v4H2zm0 7h13v4H2zm0 7h20v4H2z"/>
        </svg>
        Made in Framer
      </div>
    </div>

  </main>
</body>
</html>
