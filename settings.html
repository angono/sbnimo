  <main class="flex-1 bg-white md:m-4 md:rounded-3xl border border-gray-100 shadow-sm px-4 md:px-8 py-10 flex flex-col gap-8 max-w-full mx-auto w-full">
    
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-gray-900">Settings</h1>
    </div>

    <div class="flex items-center gap-4 p-5 bg-gray-50 border border-gray-100 rounded-2xl">
      <div class="w-14 h-14 bg-amber-500 text-white rounded-full flex items-center justify-center text-xl font-bold shadow-sm shadow-amber-500/10 shrink-0">
        {{ user.avatarLetters }}
      </div>
      <div class="flex flex-col min-w-0">
        <h2 class="text-lg font-semibold text-gray-900 truncate">{{ user.username }}</h2>
        <p class="text-sm text-gray-500 truncate">{{ user.email }}</p>
      </div>
    </div>

    <div class="flex flex-col border border-gray-100 rounded-2xl divide-y divide-gray-100 overflow-hidden bg-white">
      <button 
        v-for="item in settingsOptions" 
        :key="item.id"
        @click="handleAction(item.action)"
        class="flex items-center justify-between p-4 text-left transition-all group"
        :class="item.isDangerous ? 'hover:bg-red-50 text-red-600' : 'hover:bg-gray-50 text-gray-700'"
      >
        <div class="flex items-center gap-3.5">
          <div 
            class="w-10 h-10 rounded-xl flex items-center justify-center transition-colors"
            :class="item.isDangerous ? 'bg-red-100/60 text-red-600 group-hover:bg-red-100' : 'bg-gray-100 text-gray-500 group-hover:bg-gray-200 group-hover:text-gray-900'"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" :d="item.iconPath" />
            </svg>
          </div>
          <span class="text-sm font-medium" :class="{'text-gray-900 group-hover:text-gray-900': !item.isDangerous}">
            {{ item.label }}
          </span>
        </div>

        <div class="text-gray-400 group-hover:text-gray-600 group-hover:translate-x-0.5 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
          </svg>
        </div>
      </button>
    </div>

  </main>

    createApp({
      setup() {
        const user = ref({
          username: 'John Doe',
          email: 'johndoe@example.com',
          avatarLetters: 'JD'
        });

        const settingsOptions = ref([
          {
            id: 'edit-profile',
            label: 'Edit Profile',
            action: 'profile',
            isDangerous: false,
            iconPath: 'M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z'
          },
          {
            id: 'edit-email',
            label: 'Edit Email',
            action: 'email',
            isDangerous: false,
            iconPath: 'M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75'
          },

          },
          {
            id: 'language',
            label: 'Language',
            action: 'language',
            isDangerous: false,
            iconPath: 'M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-.778.099-1.533.284-2.253'

          },
          {
            id: 'terms-of-use',
            label: 'Terms of Use',
            action: 'terms',
            isDangerous: false,
            iconPath: 'M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5A3.375 3.375 0 0 0 10.125 2.25H4.125A2.25 2.25 0 0 0 1.875 4.5v15a2.25 2.25 0 0 0 2.25 2.25h12A2.25 2.25 0 0 0 18.375 19.5V17.25m-16.5-6h16.5m-16.5-3h16.5m-16.5-3h10.5'
          },
          {
            id: 'logout',
            label: 'Logout',
            action: 'logout',
            isDangerous: true,
            iconPath: 'M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75'
          }
        ]);

        const handleAction = (actionName) => {
          console.log(`Executing operation route target: ${actionName}`);
          if (actionName === 'logout') {
            alert('Logging out...');
          } else {
            alert(`Maps to: ${actionName} configuration view`);
          }
        };

        return {
          user,
          settingsOptions,
          handleAction
        };
      }
    }).mount('#app');
