<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    [v-cloak] { display: none; }
  </style>
</head>
<body id="app" v-cloak class="bg-gray-50 text-gray-900 flex min-h-screen antialiased items-center justify-center p-4">

  <main class="bg-white md:rounded-3xl border border-gray-100 shadow-sm px-6 py-10 md:p-12 flex flex-col gap-8 max-w-md w-full">
    
    <div class="flex flex-col items-center text-center gap-4">
      <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center shadow-md shadow-amber-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="white" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
      </div>
      <div class="flex flex-col gap-1.5">
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">Welcome back</h1>
        <p class="text-sm text-gray-500">Please enter your credentials to log in</p>
      </div>
    </div>

    <div v-if="errorMessage" class="flex items-start gap-3 p-4 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 shrink-0 mt-0.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <form @submit.prevent="handleLogin" class="flex flex-col gap-5">
      
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-semibold text-gray-700">Email Address</label>
        <div class="relative flex items-center">
          <div class="absolute left-4 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
            </svg>
          </div>
          <input 
            id="email"
            v-model="form.email"
            type="email" 
            required
            placeholder="name@example.com"
            class="w-full pl-12 pr-4 py-3.5 bg-white border border-gray-200 rounded-xl text-sm transition-all focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 placeholder:text-gray-400"
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label for="password" class="text-sm font-semibold text-gray-700">Password</label>
          <a href="#" class="text-xs font-semibold text-amber-600 hover:text-amber-700 transition-colors">Forgot password?</a>
        </div>
        <div class="relative flex items-center">
          <div class="absolute left-4 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
          </div>
          <input 
            id="password"
            v-model="form.password"
            :type="showPassword ? 'text' : 'password'" 
            required
            placeholder="••••••••"
            class="w-full pl-12 pr-12 py-3.5 bg-white border border-gray-200 rounded-xl text-sm transition-all focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 placeholder:text-gray-400"
          />
          <button 
            type="button"
            @click="showPassword = !showPassword"
            class="absolute right-4 text-gray-400 hover:text-gray-600 transition-colors"
          >
            <svg v-if="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg v-else xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <div class="flex items-center">
        <label class="flex items-center gap-2.5 cursor-pointer group select-none">
          <input 
            type="checkbox" 
            v-model="form.rememberMe"
            class="w-4.5 h-4.5 text-amber-500 border-gray-200 rounded focus:ring-amber-500/10 focus:ring-offset-0 focus:ring-2"
          />
          <span class="text-sm font-medium text-gray-600 group-hover:text-gray-900 transition-colors">Keep me signed in</span>
        </label>
      </div>

      <button 
        type="submit"
        :disabled="isSubmitting"
        class="w-full bg-gray-900 text-white font-medium py-3.5 rounded-xl flex items-center justify-center shadow-lg shadow-gray-900/10 hover:bg-gray-800 transition-all focus:outline-none focus:ring-4 focus:ring-gray-900/10 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span v-if="!isSubmitting">Sign In</span>
        <svg v-else class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>

    <div class="text-center">
      <p class="text-sm text-gray-500">
        Don't have an account? 
        <a href="#" class="font-semibold text-amber-600 hover:text-amber-700 transition-colors">Create one free</a>
      </p>
    </div>

  </main>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const showPassword = ref(false);
        const isSubmitting = ref(false);
        const errorMessage = ref('');

        const form = ref({
          email: '',
          password: '',
          rememberMe: false
        });

        const handleLogin = () => {
          isSubmitting.ref = true;
          errorMessage.value = '';
          
          console.log('Dispatching user execution route payload:', JSON.parse(JSON.stringify(form.value)));

          // Simulate an async API network call sequence
          setTimeout(() => {
            isSubmitting.value = false;
            
            // Dummy authentication validator handler block
            if (form.value.email === 'johndoe@example.com' && form.value.password === 'password') {
              alert('Authentication successful! Navigating to dashboard view...');
              window.location.href = 'index.html';
            } else {
              errorMessage.value = 'Invalid email address or security key validation sequence failed.';
            }
          }, 1200);
        };

        return {
          form,
          showPassword,
          isSubmitting,
          errorMessage,
          handleLogin
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
